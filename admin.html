<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kareen's CRM | Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f4f6f9;
      --panel-bg: #ffffff;
      --navy: #0B1D3A;
      --gold: #C8A96E;
      --text-dark: #222222;
      --text-muted: #777777;
      --border: #e2e8f0;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --pending-bg: #feeed8;
      --pending-text: #b06000;
    }

    body {
      margin: 0; padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
    }

    /* Sidebar & Layout */
    .dashboard-container {
      display: flex; min-height: 100vh;
    }
    
    .sidebar {
      width: 260px; background-color: var(--navy); color: #fff;
      padding: 30px 20px; display: flex; flex-direction: column; gap: 40px;
    }
    
    .sidebar .logo {
      font-size: 22px; font-weight: 700; letter-spacing: 1px; color: var(--gold);
    }

    .nav-menu {
      display: flex; flex-direction: column; gap: 10px;
    }
    
    .nav-item {
      padding: 14px 16px; border-radius: 8px; font-weight: 500;
      color: #a0aec0; cursor: pointer; transition: 0.2s;
    }
    .nav-item.active, .nav-item:hover {
      background-color: rgba(255,255,255,0.05); color: var(--gold);
    }

    /* Main Content Area */
    .main-content {
      flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 30px;
    }

    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding-bottom: 20px;
    }

    .dashboard-header h1 { margin: 0; font-size: 28px; color: var(--navy); }
    
    /* Stats Row */
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    }
    
    .stat-card {
      background-color: var(--panel-bg); padding: 24px; border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid var(--border);
    }
    .stat-card .label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .stat-card .value { font-size: 32px; font-weight: 700; color: var(--navy); margin-top: 8px; }

    /* Data Table Panel */
    .table-panel {
      background-color: var(--panel-bg); border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-header-bar {
      padding: 20px 24px; background-color: #fff; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .table-header-bar h3 { margin: 0; font-size: 18px; color: var(--navy); }

    .crm-table {
      width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;
    }
    .crm-table th {
      background-color: #f8fafc; padding: 16px 24px; font-weight: 600;
      color: var(--text-muted); border-bottom: 1px solid var(--border);
    }
    .crm-table td {
      padding: 18px 24px; border-bottom: 1px solid var(--border); vertical-align: middle;
    }
    .crm-table tr:hover { background-color: #f8fafc; }

    /* Badges & Actions */
    .status-badge {
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block;
    }
    .status-badge.pending { background-color: var(--pending-bg); color: var(--pending-text); }
    .status-badge.completed { background-color: var(--success-bg); color: var(--success-text); }

    .action-btn {
      padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background-color: #fff; cursor: pointer;
      transition: 0.2s; display: inline-flex; align-items: center; gap: 4px;
    }
    .action-btn:hover {
      background-color: var(--navy); color: #fff; border-color: var(--navy);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <div class="sidebar">
      <div class="logo">KAREEN CRM</div>
      <div class="nav-menu">
        <div class="nav-item active">📅 Viewings Registry</div>
        <div class="nav-item" onclick="alert('Properties Management Module Coming Soon')">🏢 Manage Listings</div>
      </div>
    </div>

    <div class="main-content">
      <div class="dashboard-header">
        <h1>Viewing Appointments</h1>
        <div style="font-size: 14px; font-weight: 500; color: var(--text-muted);" id="liveClock"></div>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="label">Total Leads</div><div class="value" id="stat-total">0</div></div>
        <div class="stat-card"><div class="label">Pending Follow-up</div><div class="value" id="stat-pending" style="color: var(--accent);">0</div></div>
        <div class="stat-card"><div class="label">Actioned Leads</div><div class="value" id="stat-completed" style="color: var(--success);">0</div></div>
      </div>

      <div class="table-panel">
        <div class="table-header-bar">
          <h3>Real-time Leads Ledger</h3>
          <button class="action-btn" onclick="fetchAppointmentsData()" style="font-size:13px;">🔄 Refresh Feed</button>
        </div>
        <table class="crm-table">
          <thead>
            <tr>
              <th>Client Name</th>
              <th>Phone Number</th>
              <th>Target Date</th>
              <th>Time Slot</th>
              <th>Status</th>
              <th>Action Ledger</th>
            </tr>
          </thead>
          <tbody id="leadsTableBody">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px;">Connecting to Supabase pipeline data stream...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Handshake Protocol
    const supabaseUrl = 'https://fryynuhukubqppilqpfk.supabase.co';
    const supabaseKey = 'sb_publishable_GnK_xyRsCtIO7vtE9k-zPw_eSs4Erd0';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // Set Live Clock
    document.getElementById('liveClock').innerText = `System Time: ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;

    async function fetchAppointmentsData() {
      try {
        // 从云端提取所有的预约记录，按照创建时间倒序排列（最新的在最上面）
        let { data: appointments, error } = await supabase
          .from('appointments')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        const tbody = document.getElementById('leadsTableBody');
        tbody.innerHTML = '';

        if (!appointments || appointments.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px;">No viewing leads registered in the cloud data table yet.</td></tr>`;
          updateMetrics(0, 0, 0);
          return;
        }

        let total = appointments.length;
        let pending = 0;
        let completed = 0;

        appointments.forEach(lead => {
          const status = lead.status || 'Pending';
          if (status === 'Pending') pending++;
          else completed++;

          const isDone = status === 'Completed';
          const badgeClass = isDone ? 'completed' : 'pending';
          const badgeText = isDone ? '✓ Contacted' : '⏳ Pending';
          
          // 根据当前状态动态切换按钮的文字和功能
          const btnText = isDone ? 'Mark Pending' : '✓ Mark Contacted';
          const nextStatus = isDone ? 'Pending' : 'Completed';

          let rowHTML = `
            <tr>
              <td style="font-weight: 600; color: var(--navy);">${escapeHtml(lead.client_name || 'Anonymous User')}</td>
              <td>
                <a href="https://wa.me/${formatPhoneForWhatsApp(lead.client_phone)}" target="_blank" style="color: var(--success); font-weight: 600; text-decoration: underline;">
                  📱 ${escapeHtml(lead.client_phone || '-')}
                </a>
              </td>
              <td style="font-weight: 500;">📅 ${escapeHtml(lead.booking_date)}</td>
              <td><span style="background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-weight: 600;">⏰ ${escapeHtml(lead.time_slot)}</span></td>
              <td><span class="status-badge ${badgeClass}">${badgeText}</span></td>
              <td>
                <button class="action-btn" onclick="updateLeadStatus('${lead.id}', '${nextStatus}')">${btnText}</button>
              </td>
            </tr>
          `;
          tbody.innerHTML += rowHTML;
        });

        updateMetrics(total, pending, completed);

      } catch (err) {
        console.error("CRM Ledger synchronization rupture:", err.message);
        document.getElementById('leadsTableBody').innerHTML = `<tr><td colspan="6" style="text-align: center; color: red; padding: 40px;">Pipeline Error: ${err.message}</td></tr>`;
      }
    }

    // 更新看板顶部的统计卡片数字
    function updateMetrics(total, pending, completed) {
      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-pending').innerText = pending;
      document.getElementById('stat-completed').innerText = completed;
    }

    // 【一键勾选核心逻辑】：直接发起 UPDATE 请求修改状态并刷新表格
    async function updateLeadStatus(id, targetStatus) {
      try {
        const { error } = await supabase
          .from('appointments')
          .update({ status: targetStatus })
          .eq('id', id);

        if (error) throw error;
        // 瞬间重整账本
        fetchAppointmentsData();
      } catch (err) {
        alert(`Failed to update status parameters: ${err.message}`);
      }
    }

    // 工具函数：安全过滤，防止恶意代码
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // 工具函数：自动把大马格式电话号（如012...）格式化为国际格式（6012...）以便一键直达真实 WhatsApp
    function formatPhoneForWhatsApp(phone) {
      if(!phone) return '';
      let clean = phone.replace(/\D/g, '');
      if(clean.startsWith('0')) {
        clean = '6' + clean;
      }
      return clean;
    }

    // 网页一打开，立刻执行云端同步
    fetchAppointmentsData();
  </script>
</body>
</html>
